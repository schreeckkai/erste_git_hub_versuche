<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganzrationale Funktionen - Rekonstruktion</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        body { 
            font-family: Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { 
            max-width: 1000px; 
            margin: 0 auto; 
        }
        h1 { 
            text-align: center; 
            color: white; 
            margin-bottom: 30px;
            font-size: 2em;
        }
        .flashcard {
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            position: relative;
            transition: all 0.3s;
        }
        .flashcard.flipped {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 900px;
            max-height: 90vh;
            z-index: 1000;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .card-inner {
            position: relative;
        }
        .card-front, .card-back {
            width: 100%;
            padding: 30px;
            border-radius: 10px;
        }
        .card-front {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .card-back {
            background: white;
            display: none;
        }
        .flashcard.flipped .card-front {
            display: none;
        }
        .flashcard.flipped .card-back {
            display: block;
        }
        .card-header {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .task-text {
            font-size: 1.2em;
            line-height: 1.6;
            font-style: italic;
        }
        .click-hint {
            margin-top: 20px;
            font-size: 0.9em;
            opacity: 0.8;
        }
        .solution-box {
            background: #e8f5e9;
            border: 2px solid #4caf50;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
        }
        .solution-box h3 {
            color: #2e7d32;
            margin-bottom: 10px;
        }
        .equation {
            background: white;
            padding: 10px;
            margin: 8px 0;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 1.1em;
        }
        .graph-container {
            margin: 20px 0;
            text-align: center;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
        }
        .graph-container canvas {
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            max-width: 100%;
        }
        .explanation {
            background: #e3f2fd;
            border: 2px solid #2196f3;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }
        .explanation strong {
            color: #1976d2;
        }
        .back-button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1em;
            margin-top: 20px;
            width: 100%;
        }
        .back-button:hover {
            background: #5568d3;
        }
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 999;
        }
        .overlay.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Ganzrationale Funktionen – Rekonstruktion</h1>
        <div id="cards"></div>
    </div>
    <div class="overlay" onclick="closeAllCards()"></div>

    <script>
        const cardsData = [
            {
                id: 'A',
                points: 2,
                task: "Eine zum Ursprung punktsymmetrische ganzrationale Funktion 3. Grades verläuft durch C(2 | -3).",
                equations: [
                    "f(x) = ax³ + bx (nur ungerade Potenzen)",
                    "f(2) = -3",
                    "8a + 2b = -3"
                ],
                explanation: "Punktsymmetrie zum Ursprung bedeutet: nur ungerade Exponenten (x³, x).",
                drawGraph: drawPunktsymmetrisch
            },
            {
                id: 'B',
                points: 2,
                task: "Eine ganzrationale Funktion 4. Grades hat bei x = 0 einen Hochpunkt mit dem y-Wert 8.",
                equations: [
                    "f(x) = ax⁴ + bx³ + cx² + dx + e",
                    "f(0) = 8 → e = 8",
                    "f'(0) = 0 → d = 0"
                ],
                explanation: "Hochpunkt bei x=0: Funktionswert 8, Steigung 0, Krümmung negativ.",
                drawGraph: drawHochpunkt
            },
            {
                id: 'C',
                points: 2,
                task: "Der Graph einer ganzrationalen Funktion 3. Grades hat bei x = 1 einen Tiefpunkt T(1 | 2).",
                equations: [
                    "f(x) = ax³ + bx² + cx + d",
                    "f(1) = 2 → a + b + c + d = 2",
                    "f'(1) = 0 → 3a + 2b + c = 0"
                ],
                explanation: "Tiefpunkt: Funktionswert 2, erste Ableitung 0, zweite Ableitung positiv.",
                drawGraph: drawTiefpunkt
            },
            {
                id: 'D',
                points: 2,
                task: "Eine ganzrationale Funktion 3. Grades hat bei x = 2 eine doppelte Nullstelle.",
                equations: [
                    "f(x) = ax³ + bx² + cx + d",
                    "f(2) = 0 → 8a + 4b + 2c + d = 0",
                    "f'(2) = 0 → 12a + 4b + c = 0"
                ],
                explanation: "Doppelte Nullstelle = Berührstelle: Funktion und Ableitung sind 0.",
                drawGraph: drawDoppelteNullstelle
            },
            {
                id: 'E',
                points: 2,
                task: "Der Graph einer ganzrationalen Funktion 4. Grades schneidet die y-Achse im Punkt (0 | -2) mit der Steigung 1.",
                equations: [
                    "f(x) = ax⁴ + bx³ + cx² + dx + e",
                    "f(0) = -2 → e = -2",
                    "f'(0) = 1 → d = 1"
                ],
                explanation: "y-Achsenabschnitt bei x=0, Steigung ist die erste Ableitung dort.",
                drawGraph: drawYAchse
            },
            {
                id: 'F',
                points: 2,
                task: "Der Graph einer ganzrationalen Funktion 2. Grades verläuft durch P(-3 | 5) und hat dort die Steigung -1.",
                equations: [
                    "f(x) = ax² + bx + c",
                    "f(-3) = 5 → 9a - 3b + c = 5",
                    "f'(-3) = -1 → -6a + b = -1"
                ],
                explanation: "Punkt und Steigung an dieser Stelle ergeben zwei Gleichungen.",
                drawGraph: drawPunktSteigung
            },
            {
                id: 'G',
                points: 3,
                task: "Eine ganzrationale Funktion 3. Grades hat einen Wendepunkt W(0 | 0) und geht durch P(1 | 1).",
                equations: [
                    "f(x) = ax³ + bx² + cx + d",
                    "f(0) = 0 → d = 0",
                    "f''(0) = 0 → 2b = 0 → b = 0",
                    "f(1) = 1 → a + c = 1"
                ],
                explanation: "Wendepunkt bei (0|0): f(0)=0 und f''(0)=0. Plus Punkt (1|1).",
                drawGraph: drawWendepunkt
            },
            {
                id: 'H',
                points: 2,
                task: "Der Graph einer ganzrationalen Funktion 3. Grades geht durch den Ursprung und hat bei x = 1 die Steigung 3.",
                equations: [
                    "f(x) = ax³ + bx² + cx + d",
                    "f(0) = 0 → d = 0",
                    "f'(1) = 3 → 3a + 2b + c = 3"
                ],
                explanation: "Durch Ursprung bedeutet d=0. Steigung bei x=1 ist f'(1)=3.",
                drawGraph: drawUrsprung
            },
            {
                id: 'I',
                points: 3,
                task: "Eine ganzrationale Funktion 3. Grades hat bei x = -1 einen Sattelpunkt.",
                equations: [
                    "f(x) = ax³ + bx² + cx + d",
                    "f'(-1) = 0 → 3a - 2b + c = 0",
                    "f''(-1) = 0 → -6a + 2b = 0"
                ],
                explanation: "Sattelpunkt = Terrassenpunkt: erste und zweite Ableitung sind 0.",
                drawGraph: drawSattelpunkt
            },
            {
                id: 'J',
                points: 2,
                task: "Der Graph einer ganzrationalen Funktion 2. Grades hat den Scheitelpunkt S(2 | 3).",
                equations: [
                    "f(x) = ax² + bx + c",
                    "f(2) = 3 → 4a + 2b + c = 3",
                    "f'(2) = 0 → 4a + 2b = 0"
                ],
                explanation: "Scheitelpunkt ist Extremstelle: f(2)=3 und f'(2)=0.",
                drawGraph: drawScheitel
            }
        ];

        function createCards() {
            const container = document.getElementById('cards');
            cardsData.forEach((card, index) => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'flashcard';
                cardDiv.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front" onclick="flipCard(${index})">
                            <div class="card-header">Aufgabe ${card.id} (${card.points} BE)</div>
                            <div class="task-text">"${card.task}"</div>
                            <div class="click-hint"> Klicken zum Aufklappen</div>
                        </div>
                        <div class="card-back">
                            <div class="card-header"> Lösung Aufgabe ${card.id}</div>
                            <div class="solution-box">
                                <h3>📝 Gleichungen:</h3>
                                ${card.equations.map(eq => `<div class="equation">${eq}</div>`).join('')}
                            </div>
                            <div class="graph-container">
                                <h3>📈 Graph:</h3>
                                <canvas id="canvas-${index}" width="600" height="400"></canvas>
                            </div>
                            <div class="explanation">
                                <strong>💡 Erklärung:</strong> ${card.explanation}
                            </div>
                            <button class="back-button" onclick="flipBack(${index})">← Zurück zur Aufgabenübersicht</button>
                        </div>
                    </div>
                `;
                container.appendChild(cardDiv);
            });
        }

        function flipCard(index) {
            const cards = document.querySelectorAll('.flashcard');
            cards[index].classList.add('flipped');
            document.querySelector('.overlay').classList.add('show');
            setTimeout(() => drawGraph(index), 100);
        }

        function flipBack(index) {
            const cards = document.querySelectorAll('.flashcard');
            cards[index].classList.remove('flipped');
            document.querySelector('.overlay').classList.remove('show');
        }

        function closeAllCards() {
            const cards = document.querySelectorAll('.flashcard');
            cards.forEach(card => card.classList.remove('flipped'));
            document.querySelector('.overlay').classList.remove('show');
        }

        function drawGraph(index) {
            const card = cardsData[index];
            const canvas = document.getElementById(`canvas-${index}`);
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            
            // Koordinatensystem zeichnen
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const scale = 40;
            
            // Gitter
            ctx.strokeStyle = '#f0f0f0';
            ctx.lineWidth = 1;
            for(let i = 0; i < canvas.width; i += scale) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for(let i = 0; i < canvas.height; i += scale) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }
            
            // Achsen
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            
            // x-Achse
            ctx.beginPath();
            ctx.moveTo(0, centerY);
            ctx.lineTo(canvas.width, centerY);
            ctx.stroke();
            
            // y-Achse
            ctx.beginPath();
            ctx.moveTo(centerX, 0);
            ctx.lineTo(centerX, canvas.height);
            ctx.stroke();
            
            // Achsenbeschriftung
            ctx.fillStyle = '#333';
            ctx.font = 'bold 14px Arial';
            ctx.fillText('x', canvas.width - 20, centerY - 5);
            ctx.fillText('y', centerX + 5, 20);
            
            // Spezifischen Graphen zeichnen
            card.drawGraph(ctx, centerX, centerY, scale);
        }

        function drawPunktsymmetrisch(ctx, cx, cy, s) {
            // f(x) = -0.5x³ + 0.5x
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 3;
            ctx.beginPath();
            for(let px = -5; px <= 5; px += 0.1) {
                const py = -0.5 * Math.pow(px, 3) + 0.5 * px;
                const x = cx + px * s;
                const y = cy - py * s;
                if(px === -5) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            
            // Punkt C(2|-3)
            ctx.fillStyle = 'red';
            ctx.beginPath();
            ctx.arc(cx + 2*s, cy - (-3)*s, 7, 0, 2*Math.PI);
            ctx.fill();
            ctx.fillStyle = 'red';
            ctx.font = 'bold 14px Arial';
            ctx.fillText('C(2|-3)', cx + 2*s + 10, cy - (-3)*s - 10);
        }

        function drawHochpunkt(ctx, cx, cy, s) {
            // f(x) = -0.1x⁴ + 8 (herausgezoomt für bessere Sicht)
            const scale = 25; // Kleinerer Maßstab für mehr Zoom
            
            // Gitter neu zeichnen mit angepasstem Maßstab
            ctx.strokeStyle = '#f0f0f0';
            ctx.lineWidth = 1;
            for(let i = 0; i < ctx.canvas.width; i += scale*2) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, ctx.canvas.height);
                ctx.stroke();
            }
            for(let i = 0; i < ctx.canvas.height; i += scale*2) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(ctx.canvas.width, i);
                ctx.stroke();
            }
            
            // Achsen
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, cy);
            ctx.lineTo(ctx.canvas.width, cy);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(cx, 0);
            ctx.lineTo(cx, ctx.canvas.height);
            ctx.stroke();
            
            ctx.fillStyle = '#333';
            ctx.font = 'bold 14px Arial';
            ctx.fillText('x', ctx.canvas.width - 20, cy - 5);
            ctx.fillText('y', cx + 5, 20);
            
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 3;
            ctx.beginPath();
            for(let px = -5; px <= 5; px += 0.1) {
                const py = -0.1 * Math.pow(px, 4) + 8;
                const x = cx + px * scale;
                const y = cy - py * scale;
                if(px === -5) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            
            // Hochpunkt H(0|8)
            ctx.fillStyle = 'red';
            ctx.beginPath();
            ctx.arc(cx + 0*scale, cy - 8*scale, 7, 0, 2*Math.PI);
            ctx.fill();
            ctx.fillStyle = 'red';
            ctx.font = 'bold 14px Arial';
            ctx.fillText('H(0|8)', cx + 10, cy - 8*scale - 10);
        }

        function drawTiefpunkt(ctx, cx, cy, s) {
            // f(x) = x³ - 3x² + 3x + 1 (Beispiel mit TP bei x=1)
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 3;
            ctx.beginPath();
            for(let px = -1; px <= 3; px += 0.1) {
                const py = Math.pow(px, 3) - 3*Math.pow(px, 2) + 3*px + 1;
                const x = cx + px * s;
                const y = cy - py * s;
                if(px === -1) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            
            // Tiefpunkt T(1|2)
            ctx.fillStyle = 'red';
            ctx.beginPath();
            ctx.arc(cx + 1*s, cy - 2*s, 7, 0, 2*Math.PI);
            ctx.fill();
            ctx.fillStyle = 'red';
            ctx.font = 'bold 14px Arial';
            ctx.fillText('T(1|2)', cx + 1*s + 10, cy - 2*s - 10);
        }

        function drawDoppelteNullstelle(ctx, cx, cy, s) {
            // f(x) = x³ - 5x² + 8x - 4 = (x-2)²(x-1)
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 3;
            ctx.beginPath();
            for(let px = 0; px <= 4; px += 0.1) {
                const py = Math.pow(px, 3) - 5*Math.pow(px, 2) + 8*px - 4;
                const x = cx + px * s;
                const y = cy - py * s;
                if(px === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            
            // Doppelte Nullstelle bei x=2
            ctx.fillStyle = 'red';
            ctx.beginPath();
            ctx.arc(cx + 2*s, cy - 0*s, 7, 0, 2*Math.PI);
            ctx.fill();
            ctx.fillStyle = 'red';
            ctx.font = 'bold 14px Arial';
            ctx.fillText('doppelte NS bei x=2', cx + 2*s - 70, cy + 25);
        }

        function drawYAchse(ctx, cx, cy, s) {
            // f(x) = 0.1x⁴ + x - 2
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 3;
            ctx.beginPath();
            for(let px = -4; px <= 4; px += 0.1) {
                const py = 0.1 * Math.pow(px, 4) + px - 2;
                const x = cx + px * s;
                const y = cy - py * s;
                if(px === -4) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            
            // Punkt (0|-2) mit Steigung
            ctx.fillStyle = 'red';
            ctx.beginPath();
            ctx.arc(cx + 0*s, cy - (-2)*s, 7, 0, 2*Math.PI);
            ctx.fill();
            ctx.fillStyle = 'red';
            ctx.font = 'bold 14px Arial';
            ctx.fillText('(0|-2), m=1', cx + 10, cy - (-2)*s - 10);
            
            // Tangente
            ctx.strokeStyle = 'green';
            ctx.setLineDash([5, 5]);
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx - 40, cy - (-3)*s);
            ctx.lineTo(cx + 40, cy - (-1)*s);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawPunktSteigung(ctx, cx, cy, s) {
            // f(x) = 0.2x² + 0.2x + 3.8 (erfüllt exakt f(-3)=5 und f'(-3)=-1)
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 3;
            ctx.beginPath();
            for(let px = -5; px <= 2; px += 0.1) {
                const py = 0.2 * Math.pow(px, 2) + 0.2 * px + 3.8;
                const x = cx + px * s;
                const y = cy - py * s;
                if(px === -5) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            
            // Punkt P(-3|5) mit Steigung
            ctx.fillStyle = 'red';
            ctx.beginPath();
            ctx.arc(cx + (-3)*s, cy - 5*s, 7, 0, 2*Math.PI);
            ctx.fill();
            ctx.fillStyle = 'red';
            ctx.font = 'bold 14px Arial';
            ctx.fillText('P(-3|5), m=-1', cx + (-3)*s - 70, cy - 5*s - 10);
            
            // Tangente (Steigung -1: y = -x + 2)
            ctx.strokeStyle = 'green';
            ctx.setLineDash([5, 5]);
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx + (-4)*s, cy - 6*s); // x=-4, y=6
            ctx.lineTo(cx + (-2)*s, cy - 4*s); // x=-2, y=4
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawWendepunkt(ctx, cx, cy, s) {
            // f(x) = x³
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 3;
            ctx.beginPath();
            for(let px = -3; px <= 3; px += 0.1) {
                const py = Math.pow(px, 3);
                const x = cx + px * s;
                const y = cy - py * s;
                if(px === -3) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            
            // Wendepunkt W(0|0)
            ctx.fillStyle = 'red';
            ctx.beginPath();
            ctx.arc(cx + 0, cy - 0, 7, 0, 2*Math.PI);
            ctx.fill();
            ctx.fillStyle = 'red';
            ctx.font = 'bold 14px Arial';
            ctx.fillText('W(0|0)', cx + 10, cy - 10);
            
            // Punkt P(1|1)
            ctx.beginPath();
            ctx.arc(cx + 1*s, cy - 1*s, 5, 0, 2*Math.PI);
            ctx.fill();
            ctx.fillText('P(1|1)', cx + 1*s + 10, cy - 1*s);
        }

        function drawUrsprung(ctx, cx, cy, s) {
            // f(x) = x³ - x² + 3x
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 3;
            ctx.beginPath();
            for(let px = -2; px <= 3; px += 0.1) {
                const py = Math.pow(px, 3) - Math.pow(px, 2) + 3*px;
                const x = cx + px * s;
                const y = cy - py * s;
                if(px === -2) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            
            // Ursprung
            ctx.fillStyle = 'blue';
            ctx.beginPath();
            ctx.arc(cx, cy, 6, 0, 2*Math.PI);
            ctx.fill();
            ctx.fillStyle = 'blue';
            ctx.font = 'bold 14px Arial';
            ctx.fillText('O(0|0)', cx + 10, cy + 20);
            
            // Steigung bei x=1
            ctx.fillStyle = 'red';
            ctx.beginPath();
            ctx.arc(cx + 1*s, cy - 3*s, 6, 0, 2*Math.PI);
            ctx.fill();
            ctx.fillStyle = 'red';
            ctx.fillText('f\'(1)=3', cx + 1*s + 10, cy - 3*s);
        }

        function drawSattelpunkt(ctx, cx, cy, s) {
            // f(x) = x³ + 3x² + 3x + 1
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 3;
            ctx.beginPath();
            for(let px = -3; px <= 1; px += 0.1) {
                const py = Math.pow(px, 3) + 3*Math.pow(px, 2) + 3*px + 1;
                const x = cx + px * s;
                const y = cy - py * s;
                if(px === -3) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            
            // Sattelpunkt bei x=-1
            const y = Math.pow(-1, 3) + 3*Math.pow(-1, 2) + 3*(-1) + 1;
            ctx.fillStyle = 'red';
            ctx.beginPath();
            ctx.arc(cx + (-1)*s, cy - y*s, 7, 0, 2*Math.PI);
            ctx.fill();
            ctx.fillStyle = 'red';
            ctx.font = 'bold 14px Arial';
            ctx.fillText('Sattelpunkt bei x=-1', cx + (-1)*s - 70, cy - y*s - 10);
        }

        function drawScheitel(ctx, cx, cy, s) {
            // f(x) = x² - 4x + 7 (Scheitel bei S(2|3))
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 3;
            ctx.beginPath();
            for(let px = -1; px <= 5; px += 0.1) {
                const py = Math.pow(px, 2) - 4*px + 7;
                const x = cx + px * s;
                const y = cy - py * s;
                if(px === -1) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            
            // Scheitelpunkt S(2|3)
            ctx.fillStyle = 'red';
            ctx.beginPath();
            ctx.arc(cx + 2*s, cy - 3*s, 7, 0, 2*Math.PI);
            ctx.fill();
            ctx.fillStyle = 'red';
            ctx.font = 'bold 14px Arial';
            ctx.fillText('S(2|3)', cx + 2*s + 10, cy - 3*s - 10);
        }

        // Initialisierung
        createCards();
    </script>
</body>
